name: GDrive Video Compressor

on:
  workflow_dispatch:
  push:
    branches: [main]

# Only one run at a time

concurrency:
  group: video-compress-group
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest

    env:
      GDRIVE_LINKS: ${{ secrets.GDRIVE_LINKS }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -s https://rclone.org/install.sh | sudo bash
          pip install gdown

      - name: Setup rclone Config
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: Process Videos (Download → Compress → Upload → Record)
        run: python scripts/process_videos.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GDRIVE_LINKS: ${{ secrets.GDRIVE_LINKS }}
